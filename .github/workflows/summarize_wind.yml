name: Summarize wind generation data

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run summarize script
        run: python summarize_wind.py

      - name: Commit and push if data changed
        run: |
          git config user.name "wind-data-bot"
          git config user.email "actions@github.com"
          git add wind_summaries/
          git diff --staged --quiet || git commit -m "Update wind farm daily averages"
          git push
